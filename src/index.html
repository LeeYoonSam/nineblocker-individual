<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <title>NineBlockers - 개인 승점제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <h1>NINE<span class="brand-accent">BLOCKERS</span></h1>
        <p class="subtitle">개인 승점제</p>
      </div>
      <a href="admin.html" class="header-nav-link">관리자</a>
    </div>
    <nav id="year-tabs">
      <div class="sheet-selector">
        <button id="sheet-selector-btn" class="sheet-selector-btn">시트 선택 ▾</button>
        <div id="sheet-dropdown" class="sheet-dropdown hidden"></div>
      </div>
    </nav>
  </header>

  <main>
    <section id="loading" class="loading">데이터를 불러오는 중...</section>

    <section id="summary-section" class="hidden">
      <h2>상위 랭커</h2>
      <div id="summary-cards" class="card-grid"></div>
    </section>

    <section id="matrix-section" class="hidden">
      <h2>개인 기록</h2>
      <div class="table-wrapper">
        <table id="matrix-table"></table>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
